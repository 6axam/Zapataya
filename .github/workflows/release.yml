name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0
      - name: Build
        shell: bash
        run: >-
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} python -m PyInstaller --noconfirm --clean --windowed --name CommaSound
          --collect-submodules pynput --add-data "assets${{ runner.os == 'Windows' && ';' || ':' }}assets"
          comma_sound/main.py
      - name: Smoke test Linux
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./dist/CommaSound/CommaSound --self-test
      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/CommaSound/CommaSound.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Smoke test macOS
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen ./dist/CommaSound.app/Contents/MacOS/CommaSound --self-test
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CommaSound -DestinationPath CommaSound-${{ matrix.target }}.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/CommaSound.app CommaSound-${{ matrix.target }}.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar czf CommaSound-${{ matrix.target }}.tar.gz -C dist CommaSound
          sudo apt-get update && sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document
          mkdir -p package/usr/lib/comma-sound package/usr/bin package/usr/share/applications
          cp -a dist/CommaSound/. package/usr/lib/comma-sound/
          printf '#!/bin/sh\nexec /usr/lib/comma-sound/CommaSound "$@"\n' > package/usr/bin/comma-sound
          chmod +x package/usr/bin/comma-sound
          printf '[Desktop Entry]\nType=Application\nName=Comma Sound\nExec=comma-sound\nCategories=Utility;Audio;\nTerminal=false\n' > package/usr/share/applications/comma-sound.desktop
          fpm -s dir -t deb -n comma-sound -v 0.1.0 --architecture amd64 --description 'Sound when typing a comma' -C package .
          fpm -s dir -t rpm -n comma-sound -v 0.1.0 --architecture x86_64 --description 'Sound when typing a comma' -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            CommaSound-*.zip
            CommaSound-*.tar.gz
            *.deb
            *.rpm
          if-no-files-found: error
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for pattern in 'CommaSound-*.zip' 'CommaSound-*.tar.gz' '*.deb' '*.rpm'; do
            for file in $pattern; do [ -f "$file" ] && files+=("$file"); done
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

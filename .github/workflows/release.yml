name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev libxtst-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libayatana-appindicator3-dev rpm ruby ruby-dev zstd libarchive-tools
          sudo gem install fpm --no-document
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --release --bins
      - name: Sign Windows executable when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -File target/release/comma-sound.exe
      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'target/release/comma-sound.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Copy-Item target/release/comma-sound.exe CommaSound-${{ matrix.target }}.exe
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./target/release/comma-sound --self-test
          mkdir -p CommaSound.app/Contents/MacOS
          cp target/release/comma-sound CommaSound.app/Contents/MacOS/CommaSound
          cp packaging/Info.plist CommaSound.app/Contents/Info.plist
          ditto -c -k --sequesterRsrc --keepParent CommaSound.app CommaSound-${{ matrix.target }}.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          target/release/comma-sound --self-test
          cp target/release/comma-sound CommaSound-linux-x64
          mkdir -p CommaSound-linux/hyprland CommaSound-linux/assets
          cp target/release/comma-sound target/release/comma-control CommaSound-linux/
          cp hyprland/install.sh hyprland/BarWidget.qml hyprland/manifest.json CommaSound-linux/hyprland/
          cp assets/sound.wav CommaSound-linux/assets/
          tar czf CommaSound-linux-x64.tar.gz CommaSound-linux
          mkdir -p package/usr/bin package/usr/lib/comma-sound package/usr/share/applications
          cp target/release/comma-sound package/usr/bin/comma-sound
          cp target/release/comma-control package/usr/bin/comma-control
          cp assets/sound.wav package/usr/lib/comma-sound/sound.wav
          printf '[Desktop Entry]\nType=Application\nName=Comma Sound\nExec=comma-sound\nCategories=Utility;Audio;\nTerminal=false\n' > package/usr/share/applications/comma-sound.desktop
          fpm -s dir -t deb -n comma-sound -v 0.2.0 --architecture amd64 -d libasound2 -d libgtk-3-0 -d libayatana-appindicator3-1 -d libxtst6 -d libxdo3 -d libxkbcommon0 -d libxkbcommon-x11-0 --description 'Sound when typing a comma' -C package .
          fpm -s dir -t rpm -n comma-sound -v 0.2.0 --architecture x86_64 -d alsa-lib -d gtk3 -d libXtst -d xdotool -d libxkbcommon -d libxkbcommon-x11 --description 'Sound when typing a comma' -C package .
          fpm -s dir -t pacman -n comma-sound -v 0.2.0 --architecture x86_64 -d alsa-lib -d gtk3 -d libayatana-appindicator -d libxtst -d xdotool -d libxkbcommon -d libxkbcommon-x11 --description 'Sound when typing a comma' -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            CommaSound-*.zip
            CommaSound-*.exe
            CommaSound-linux-x64
            CommaSound-*.tar.gz
            *.deb
            *.rpm
            *.pkg.tar.*
          if-no-files-found: error
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for pattern in 'CommaSound-*.zip' 'CommaSound-*.exe' 'CommaSound-linux-x64' 'CommaSound-*.tar.gz' '*.deb' '*.rpm' '*.pkg.tar.*'; do
            for file in $pattern; do [ -f "$file" ] && files+=("$file"); done
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

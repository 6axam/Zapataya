[package]
name = "comma-sound"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rdev = "0.5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
tray-icon = "0.21"
tao = "0.34"

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = { version = "0.9", features = ["x11"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
